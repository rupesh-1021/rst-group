<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RST Steel | Under Development</title>
  <link rel="icon" href="RST Logo.jpeg" type="image/jpeg" />
  <style>
    :root { --primary:#1e3a8a; --accent:#f59e0b; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #334155);
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card { width: min(760px, 100%); background: rgba(255,255,255,0.96); color:#111827; border-radius:24px; padding:32px; box-shadow:0 25px 60px rgba(0,0,0,0.25); text-align:center; }
    .brand { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
    .brand img { width:72px; height:72px; border-radius:18px; }
    .brand h1 { margin:0; font-size:1.7rem; color:var(--primary); }
    .brand p { margin:4px 0 0; color:#64748b; font-size:0.95rem; }
    .status { background: linear-gradient(90deg, #fef3c7, #fff7ed); border:1px solid #fde68a; border-radius:18px; padding:24px; margin:18px 0 24px; }
    .status h2 { margin:0 0 8px; color:var(--primary); font-size:1.7rem; }
    .status p { margin:0; color:#92400e; font-size:1rem; line-height:1.6; }
    .btn { display:inline-block; padding:12px 18px; border-radius:999px; background:var(--primary); color:white; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="RST Logo.jpeg" alt="RST Logo" />
      <div>
        <h1>RST Steel Corporation Pvt Ltd</h1>
        <p>RST Group • Steel • Metals</p>
      </div>
    </div>
    <div class="status">
      <h2>Application is under Development</h2>
      <p>This experience is currently being built with the existing RST Group logo, color palette, and brand identity.</p>
    </div>
    <a class="btn" href="Home.html">Back to RST Group</a>
  </div>
</body>
</html>
